<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Prueba temporal Aitor Meteo</title>
<style>
  body{margin:0;background:#081b34;color:#eef7ff;font:14px system-ui,sans-serif}
  #result{display:block;white-space:pre-wrap;padding:16px}
  iframe{width:100%;height:680px;border:0}
</style>
<output id="result">Preparando prueba…</output>
<iframe id="app" src="./?slider-harness=1"></iframe>
<script>
  const params=new URLSearchParams(location.search),model=params.get('model')||'ecmwf',layer=params.get('layer')||'precipitation',frame=document.querySelector('#app'),result=document.querySelector('#result'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  frame.addEventListener('load',async()=>{
    const doc=frame.contentDocument,errors=[];frame.contentWindow.addEventListener('error',event=>errors.push(String(event.message||'error')));
    const until=async(predicate,limit=30000)=>{const started=performance.now();while(performance.now()-started<limit){if(predicate())return true;await wait(100)}return false};
    await until(()=>doc.querySelector('#mapModel')&&doc.querySelector('#mapLayer')&&doc.querySelector('#mapTimeRange'));
    const modelSelect=doc.querySelector('#mapModel'),layerSelect=doc.querySelector('#mapLayer'),range=doc.querySelector('#mapTimeRange');
    modelSelect.value=model;modelSelect.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
    layerSelect.value=layer;layerSelect.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
    const ready=await until(()=>!range.disabled&&Number(range.max)>=30&&modelSelect.value===model&&layerSelect.value===layer,30000);if(!ready){result.textContent=JSON.stringify({model,layer,error:'capa no preparada'});return}
    await wait(700);const marks=[];let step=0,last=performance.now();
    const timer=setInterval(()=>{const now=performance.now(),target=++step,row={target,gap:now-last};last=now;marks.push(row);range.value=target;range.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));frame.contentWindow.requestAnimationFrame(()=>{row.paint=performance.now()-now});if(step>=30){clearInterval(timer);range.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}))}},100);
    await until(()=>step>=30,10000);const settled=await until(()=>range.value==='30'&&String(doc.querySelector('#mapStatus')?.textContent||'').includes('Hora preparada'),30000),sorted=marks.map(row=>row.gap).sort((a,b)=>a-b),paints=marks.map(row=>row.paint||0).sort((a,b)=>a-b),visible=[...doc.querySelectorAll('[class*="mapNativeWeatherFrame-"]')].filter(element=>{const group=element.closest('.leaflet-layer')||element,style=frame.contentWindow.getComputedStyle(group);return Number(style.opacity||1)>.01&&style.display!=='none'}).map(element=>(element.className?.baseVal||element.className||'').match(/mapNativeWeatherFrame-(\d+)/)?.[1]).filter(Boolean);
    result.textContent=JSON.stringify({model,layer,steps:marks.length,maxGap:Math.round(sorted.at(-1)||0),p95Gap:Math.round(sorted[Math.floor(sorted.length*.95)]||0),maxPaint:Math.round(paints.at(-1)||0),cursor:range.value,status:doc.querySelector('#mapStatus')?.textContent,settled,visible,quick:doc.querySelectorAll('.mapNativeWeatherQuickTile').length,sharp:doc.querySelectorAll('.mapNativeWeatherTile:not(.mapNativeWeatherQuickTile)').length,errors});
  });
</script>
</html>
