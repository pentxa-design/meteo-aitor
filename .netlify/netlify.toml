[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/app.js"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/maps.js"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/styles.css"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/icons/*"

[headers.values]
Cache-Control = "public, max-age=604800"