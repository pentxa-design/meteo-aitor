functionsDirectoryOrigin = "default"
plugins = []
redirects = []

[build]
publish = "/Volumes/SSD EXTERNO/CLAUDE/weather-app"
publishOrigin = "config"
functions = "/Volumes/SSD EXTERNO/CLAUDE/weather-app/netlify/functions"

[build.environment]

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]
node_bundler = "esbuild"

[[headers]]
for = "/version.json"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json; charset=utf-8"
